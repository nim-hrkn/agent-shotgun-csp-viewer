function candidates(set) {
  return SYSTEMS.filter(s => [...set].every(e => s.set.has(e)));
}
function pick(sym) {
  if (sel.includes(sym)) sel = sel.filter(e => e !== sym);
  else if (candidates(new Set([...sel, sym])).length) sel = [...sel, sym];
  else sel = [sym];                 // 組み合わせが無いときは選び直し
  const cand = candidates(new Set(sel));
  const exact = cand.find(s => s.els.length === sel.length);
  if (exact) show(exact);
  else if (cand.length === 1) show(cand[0]);
  else if (cur && !cand.includes(cur)) show(null);
  else draw();
}
function show(s) { cur = s; draw(); }
function clear() { sel = []; cur = null; draw(); }

function draw() {
  const set = new Set(sel);
  const cand = candidates(set);
  const reach = new Set();
  for (const s of cand) for (const e of s.els) reach.add(e);

  for (const b of pt.querySelectorAll('.el')) {
    const e = b.dataset.el, n = (inSys.get(e) || []).length;
    b.classList.toggle('avail', n > 0);
    b.classList.toggle('on', set.has(e));
    b.classList.toggle('dim', n > 0 && sel.length > 0 && !reach.has(e));
  }

  bar.replaceChildren();
  if (sel.length) {
    const p = document.createElement('span');
    p.className = 'pick'; p.textContent = sel.join(' + ');
    bar.appendChild(p);
